<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eab308" />
    <title>DevSpace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23eab308'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-weight='900' font-size='42' fill='%23000000' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        background-color: #030305;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030305;
        color: #f4f4f5;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #030305;
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        background-color: #030305;
        color: #f4f4f5;
        user-select: none;
      }
      .app-preloader-header {
        height: 44px;
        border-bottom: 1px solid rgba(39, 39, 42, 0.6);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background-color: rgba(18, 18, 20, 0.65);
      }
      .app-preloader-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app-preloader-logo {
        width: 24px;
        height: 24px;
        background-color: #eab308;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-weight: 900;
        font-size: 11px;
        font-family: monospace;
        box-shadow: 0 0 12px rgba(234, 179, 8, 0.35);
      }
      .app-preloader-title {
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.16em;
        color: #e4e4e7;
      }
      .app-preloader-body {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
      }
      .app-preloader-sidebar {
        width: 220px;
        border-right: 1px solid rgba(39, 39, 42, 0.5);
        background-color: rgba(18, 18, 20, 0.3);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      @media (max-width: 768px) {
        .app-preloader-sidebar {
          display: none;
        }
      }
      .app-preloader-main {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
      }
      .app-preloader-skeleton {
        background: linear-gradient(90deg, rgba(39, 39, 42, 0.4) 25%, rgba(63, 63, 70, 0.6) 50%, rgba(39, 39, 42, 0.4) 75%);
        background-size: 200% 100%;
        animation: skeleton-pulse 1.8s infinite ease-in-out;
        border-radius: 6px;
      }
      @keyframes skeleton-pulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .app-preloader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(234, 179, 8, 0.15);
        border-top-color: #eab308;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="app-preloader-header">
          <div class="app-preloader-brand">
            <div class="app-preloader-logo">D</div>
            <span class="app-preloader-title">DEVSPACE</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="app-preloader-skeleton" style="width: 80px; height: 20px;"></div>
            <div class="app-preloader-skeleton" style="width: 28px; height: 28px; border-radius: 50%;"></div>
          </div>
        </div>
        <div class="app-preloader-body">
          <div class="app-preloader-sidebar">
            <div class="app-preloader-skeleton" style="width: 100%; height: 28px; margin-bottom: 8px;"></div>
            <div class="app-preloader-skeleton" style="width: 85%; height: 20px;"></div>
            <div class="app-preloader-skeleton" style="width: 70%; height: 20px;"></div>
            <div class="app-preloader-skeleton" style="width: 90%; height: 20px;"></div>
            <div class="app-preloader-skeleton" style="width: 60%; height: 20px;"></div>
          </div>
          <div class="app-preloader-main">
            <div class="app-preloader-spinner"></div>
            <span style="font-size: 11px; font-family: monospace; color: #71717a; letter-spacing: 0.1em; text-transform: uppercase;">Initializing Devspace...</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
